name: agent-checkpoint
version: 0.6.0
description: "Budget checkpoints for long runs: at 50% of a run's effective turn/time budget (tier 1) and at 80% time / 90% turns (tier 2, finalize), injects a durable-file persistence reminder via the pre_llm_call hook, and — since 0.2.0 — persists the checkpoint itself mid-run (checkpoint file + kanban comment) evaluated at tool-call boundaries and by a watchdog thread, so single-turn kanban runs cannot cross their budget silently. Since 0.3.0, a run with no discoverable cap gets a watchdog-persisted checkpoint every uncapped_interval_seconds (default 1800; 0 disables). Since 0.4.0, an optional teeth package (all default off, kanban only): a final-tier tool gate that engages only on a board-DB cap with a parsed deliverable path, per-tier deliverable movement snapshots (<run-id>.movement.json), and a successor resume excerpt on a re-run's first turn. Since 0.5.0, a fourth teeth switch (kill_at_half_cap) puts a board-capped run whose deliverable has not moved since run start into report mode at 50% of cap (tightening at 65%), and notice fix A emits a kanban run's injected budget notice only when its cap is the board's own (cap_source db), never against a fallback budget. Since 0.6.0, two more default-off capabilities: a completion-contract gate (teeth.contract_gate) that refuses kanban_complete while a PR contract declared on a Contract: line in the task body is not all-green on the PR's current head (gh CLI read-only, fail-open on gh errors), and a token-budget axis (tokens in enabled_axes) that fires checkpoint notices at 50%/80% of a configured token budget (caps.tokens) where the host exposes token usage, inert when it does not. Fail-open, per-session latched, and it never warns against a budget that does not exist."
author: mbgulden
license: MIT
requires_hermes: ">=0.20.5"
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
config_schema:
  enabled: {type: bool, default: true, description: "Master switch. False makes every hook a no-op."}
  mode: {type: str, default: snapshot, choices: [snapshot, notify, log-only], description: "snapshot injects the persistence directive; notify injects the budget numbers only; log-only records due tiers in the plugin log and injects/persists nothing."}
  tier_fractions: {type: list, default: [0.5], description: "Tier fractions of the effective budget. The first element is the tier-1 fraction; an optional second element replaces both tier-2 per-axis fractions."}
  tier2_time_fraction: {type: float, default: 0.8, description: "Tier 2 (finalize) threshold on the time axis."}
  tier2_turn_fraction: {type: float, default: 0.9, description: "Tier 2 (finalize) threshold on the turn axis."}
  min_budget_floor_turns: {type: int, default: 0, description: "A turn axis whose cap is below this is ignored."}
  min_budget_floor_seconds: {type: float, default: 0.0, description: "A time axis whose cap (seconds) is below this is ignored."}
  enabled_axes: {type: list, default: [time, turns], description: "Which budget axes count towards tiers: any of time, turns, tokens (0.6.0: the token axis also needs caps.tokens set and a host token-usage source; absent usage it is inert)."}
  checkpoint_dir: {type: str, default: "$HERMES_HOME/agent-checkpoints/", description: "Directory holding the durable checkpoint files (<run-id>.md). Values starting with $ are environment-expanded."}
  allow_tiny_tier1: {type: bool, default: false, description: "Fire tier 1 even on tiny caps (turn cap < 10 or time cap < 5 min), where tier 1 and tier 2 would land within about 2 turns of each other."}
  caps: {type: dict, default: {}, description: "Plugin-supplied caps for runs whose native cap is undiscoverable: {time_seconds: <float>, turns: <int>}."}
  caps.time_seconds: {type: float, description: "Plugin-supplied time cap in seconds (part of caps). Unset means none."}
  caps.turns: {type: int, description: "Plugin-supplied turn cap (part of caps). Unset means none."}
  caps.tokens: {type: int, description: "Plugin-supplied token budget (part of caps, 0.6.0) for the tokens axis. Unset means no token budget; the axis also stays inert until the host exposes token usage."}
  tier1_template: {type: str, description: "Custom tier-1 text; placeholders {turns_used} {turns_cap} {turns_left} {time_used} {time_cap} {time_left} {checkpoint_file}. Unset uses the shipped default."}
  tier2_template: {type: str, description: "Custom tier-2 text; same placeholders as tier1_template. Unset uses the shipped default."}
  mid_run_persist: {type: bool, default: true, description: "Evaluate tiers at tool-call boundaries and from the watchdog, persisting the checkpoint itself mid-run. False restores prologue-only behavior."}
  watchdog: {type: bool, default: true, description: "Run the per-session watchdog thread that covers a run parked inside one long tool call."}
  watchdog_poll_seconds: {type: float, default: 10.0, description: "Watchdog poll interval in seconds (floored at 0.05)."}
  uncapped_interval_seconds: {type: float, default: 1800.0, description: "Runs with no discoverable cap: persist a checkpoint every this many elapsed seconds. The first fire also posts the kanban comment (kanban runs only); later fires are file-only. 0 disables uncapped-run coverage."}
  teeth: {type: dict, default: {}, description: "Teeth package switches (0.4.0; kill_at_half_cap added 0.5.0; contract_gate added 0.6.0), all default off, kanban dialect only: {gate_final_tier: bool, movement_signal: bool, resume_read: bool, kill_at_half_cap: bool, contract_gate: bool}."}
  teeth.gate_final_tier: {type: bool, default: false, description: "After the final tier fires, refuse non-finishing tool calls via the pre_tool_call veto. Engages only when cap_source is the board DB and a deliverable path was parsed from the task body."}
  teeth.movement_signal: {type: bool, default: false, description: "Append a deliverable movement snapshot to <run-id>.movement.json at every mid-run persist."}
  teeth.resume_read: {type: bool, default: false, description: "On a kanban run's first turn, inject a bounded excerpt of a prior run's checkpoint file for the same task."}
  teeth.kill_at_half_cap: {type: bool, default: false, description: "Half-cap kill rule (0.5.0): on a board-capped run (cap_source db, deliverable path parsed) whose deliverable has not moved since run start, enter report mode at 50% of cap — only deliverable/checkpoint writes and kanban wrap-up calls pass, and one comment names the kill with the snapshot evidence. At 65% only checkpoint writes pass. Any deliverable movement exits report mode and disarms the rule for the run."}
  teeth.contract_gate: {type: bool, default: false, description: "Completion-contract gate (0.6.0): when a kanban task body declares a contract on a Contract: line (Contract: <owner/repo> PR #<n>; required checks: <names>), refuse kanban_complete while the named PR's required checks are not all green on the PR's current head — red, pending, or no result on the current head (stale) all refuse. PR state is read read-only via the gh CLI; any gh error fails open (completion allowed, logged, and a comment notes the contract was not verified). Non-contract cards are untouched."}
